services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  quality-score-worker:
    build: .
    command: npm run worker:quality-score
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  ambient-insight-worker:
    build: .
    command: npm run worker:ambient-insight
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma
