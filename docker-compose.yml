services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  quality-score-worker:
    build: .
    command: npm run worker:quality-score
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  ambient-insight-worker:
    build: .
    command: npm run worker:ambient-insight
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  embedding-worker:
    build: .
    command: npm run worker:embedding
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  scheduled-prompt-worker:
    build: .
    command: npm run worker:scheduled-prompt
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  prompt-lab-worker:
    build: .
    command: npm run worker:prompt-lab
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma
